<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- External actor -->
  <text x="310" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a1a1aa">Guests &amp; Staff</text>
  <line x1="310" y1="24" x2="310" y2="46" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Frontend container -->
  <rect x="30" y="48" width="560" height="112" rx="14" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="46" y="68" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#bfdbfe">Next.js Frontend</text>

  <g>
    <rect x="46" y="80" width="165" height="66" rx="10" fill="#17304d" stroke="#3b82f6" stroke-width="1"/>
    <text x="128" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#bfdbfe">Public Website</text>
    <text x="128" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#93c5fd">Marketing site, EN / RO</text>
  </g>

  <g>
    <rect x="228" y="80" width="165" height="66" rx="10" fill="#17304d" stroke="#3b82f6" stroke-width="1"/>
    <text x="310" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#bfdbfe">Booking Engine</text>
    <text x="310" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#93c5fd">Availability, Pricing</text>
  </g>

  <g>
    <rect x="410" y="80" width="165" height="66" rx="10" fill="#17304d" stroke="#3b82f6" stroke-width="1"/>
    <text x="492" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#bfdbfe">Admin PMS</text>
    <text x="492" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#93c5fd">Reservations, Rooms</text>
  </g>

  <line x1="310" y1="160" x2="310" y2="186" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Backend -->
  <g>
    <rect x="190" y="190" width="240" height="64" rx="10" fill="#301a4d" stroke="#a855f7" stroke-width="1"/>
    <text x="310" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e9d5ff">NestJS Backend</text>
    <text x="310" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d8b4fe">REST API + JWT Auth</text>
  </g>

  <!-- Stripe (side integration) -->
  <line x1="430" y1="222" x2="452" y2="222" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-coral)"/>
  <g>
    <rect x="456" y="192" width="134" height="60" rx="10" fill="#4a2a12" stroke="#fb923c" stroke-width="1"/>
    <text x="523" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fed7aa">Stripe</text>
    <text x="523" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fdba74">Deposits &amp; Payments</text>
  </g>

  <line x1="310" y1="254" x2="310" y2="280" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Prisma -->
  <g>
    <rect x="190" y="284" width="240" height="54" rx="10" fill="#0f3d38" stroke="#2dd4bf" stroke-width="1"/>
    <text x="310" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#99f6e4">Prisma ORM</text>
    <text x="310" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5eead4">Type-safe queries</text>
  </g>

  <line x1="310" y1="338" x2="310" y2="364" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- PostgreSQL -->
  <g>
    <rect x="190" y="368" width="240" height="58" rx="10" fill="#3f3f46" stroke="#71717a" stroke-width="1"/>
    <text x="310" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#f4f4f5">PostgreSQL</text>
    <text x="310" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#a1a1aa">Reservations, Payments, Users</text>
  </g>

  <text x="310" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a1a1aa">One Next.js app serves three surfaces on top of a single NestJS + PostgreSQL backend.</text>
</svg>
