<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="20" width="160" height="70" rx="10" fill="#3f3f46" stroke="#71717a" stroke-width="1"/>
    <text x="120" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#f4f4f5">Domain List</text>
    <text x="120" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#a1a1aa">input domains.csv</text>
  </g>

  <line x1="200" y1="55" x2="216" y2="55" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="220" y="20" width="160" height="70" rx="10" fill="#17304d" stroke="#3b82f6" stroke-width="1"/>
    <text x="300" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#bfdbfe">HTTP Fetch</text>
    <text x="300" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#93c5fd">Headers, Cookies, HTML</text>
  </g>

  <line x1="380" y1="55" x2="396" y2="55" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <g>
    <rect x="400" y="20" width="160" height="70" rx="10" fill="#17304d" stroke="#3b82f6" stroke-width="1"/>
    <text x="480" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#bfdbfe">Playwright Browser</text>
    <text x="480" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#93c5fd">Rendered HTML, JS Globals</text>
  </g>

  <!-- connector down: row1 -> row2 -->
  <line x1="480" y1="90" x2="480" y2="116" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Row 2 (right to left), taller boxes to fit the two-line subtitle -->
  <g>
    <rect x="400" y="118" width="160" height="84" rx="10" fill="#301a4d" stroke="#a855f7" stroke-width="1"/>
    <text x="480" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e9d5ff">Technology Detection</text>
    <text x="480" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d8b4fe">Native Rules +</text>
    <text x="480" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d8b4fe">Wappalyzer Fingerprints</text>
  </g>

  <line x1="400" y1="160" x2="384" y2="160" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <g>
    <rect x="220" y="118" width="160" height="84" rx="10" fill="#301a4d" stroke="#a855f7" stroke-width="1"/>
    <text x="300" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e9d5ff">Evidence Engine</text>
    <text x="300" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d8b4fe">Confidence Scoring</text>
  </g>

  <line x1="220" y1="160" x2="204" y2="160" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <g>
    <rect x="40" y="118" width="160" height="84" rx="10" fill="#3f3f46" stroke="#71717a" stroke-width="1"/>
    <text x="120" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#f4f4f5">Results Export</text>
    <text x="120" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#a1a1aa">results.csv / .json</text>
  </g>

  <text x="300" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a1a1aa">Each stage adds evidence (headers, cookies, DOM, scripts) that feeds the final confidence score.</text>
</svg>
